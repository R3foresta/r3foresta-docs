<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="title description">
<title id="title">Actores y casos de uso generales de R3Foresta</title>
<desc id="description">Vista horizontal en cuatro paneles del mismo sistema y del mismo actor ADMIN global. La recepción y validación de semillas corresponde a ADMIN o VALIDADOR asignado al vivero de almacenamiento y distinto del recolector. Las asociaciones indican interacción, sujeta a las reglas de cada operación.</desc>
<defs><g id="actor" fill="none" stroke="#17212b" stroke-width="3.5" stroke-linecap="round"><circle cy="-24" r="16"/><path d="M 0 -8 V 35 M -32 5 H 32 M 0 35 L -26 66 M 0 35 L 26 66"/></g>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b;text-anchor:middle}.title{font-size:39px;font-weight:bold}.head{font-size:29px;font-weight:bold}.actor-label{font-size:22px}.case{fill:#fff;stroke:#17212b;stroke-width:2.8}.case-text{font-size:23px}.id{font-weight:bold}.assoc{fill:none;stroke:#3c4b58;stroke-width:2.3}.note{font-size:23px}</style></defs>
<rect width="3200" height="1800" fill="white"/>
<text class="title" x="1600" y="62">R3Foresta · actores y casos de uso generales</text>
<text class="note" x="1600" y="104">Cuatro vistas del mismo sistema; ADMIN global se repite para facilitar la lectura.</text>
