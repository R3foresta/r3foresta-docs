<text class="note" x="1600" y="1680">La recepción de semillas requiere ADMIN o VALIDADOR asignado al vivero de almacenamiento, distinto del recolector.</text>
<text class="note" x="1600" y="1718">Las asociaciones expresan interacción y no sustituyen la autorización vigente, los contratos ni la evidencia de implementación.</text>
<text class="note" x="1600" y="1756">La consulta pública de Plantación no equivale al acceso público a la traza operativa completa de Recolección y Vivero.</text>
