<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2010" viewBox="0 0 2000 2010" role="img" aria-labelledby="title description">
  <title id="title">Actores y casos de uso generales de R3Foresta</title>
  <desc id="description">Diagrama UML de objetivos funcionales. Administración global se asocia con CU-01 a CU-12, sujetos a sus reglas. Los actores operativos se relacionan con sus casos principales. La consulta operativa autorizada CU-12 se distingue de la información pública de Plantación PA-S02, accesible al visitante sin cuenta. El operario de vivero realiza también la recepción habitual. Las asociaciones no afirman implementación ni sustituyen las condiciones de autorización.</desc>
  <defs>
    <g id="actor" fill="none" stroke="#17212b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-29" r="18"/>
      <path d="M 0 -11 V 38 M -39 7 H 39 M 0 38 L -32 72 M 0 38 L 32 72"/>
    </g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; text-anchor: middle; }
      .actor-label { font-size: 26px; }
      .use-case { fill: #fff; stroke: #17212b; stroke-width: 2.5; }
      .case-label { font-size: 28px; }
      .case-id { font-weight: 700; }
      .association { fill: none; stroke: #17212b; stroke-width: 2.2; }
      .admin-association { fill: none; stroke: #47525d; stroke-width: 1.9; }
    </style>
  </defs>
  <rect width="2000" height="2010" fill="#fff"/>
  <rect x="450" y="65" width="1000" height="1790" fill="#fff" stroke="#17212b" stroke-width="3"/>
  <text x="950" y="113" font-size="31" font-weight="700">R3Foresta · alcance académico</text>

  <g class="association">
    <path d="M 249 477 L 560 430"/>
    <path d="M 249 477 L 560 540"/>
    <path d="M 249 657 L 560 680"/>
    <path d="M 249 912 L 560 830"/>
    <path d="M 249 912 L 560 940"/>
    <path d="M 249 912 L 560 1050"/>
    <path d="M 249 1227 L 560 1190"/>
    <path d="M 249 1227 L 560 1300"/>
    <path d="M 249 1407 L 560 1440"/>
    <path d="M 249 1587 L 560 1590"/>
    <path d="M 249 1787 L 560 1780"/>
  </g>
  <g class="admin-association">
    <path d="M 1601 907 L 1340 180"/>
    <path d="M 1601 907 L 1340 290"/>
    <path d="M 1601 907 L 1340 430"/>
    <path d="M 1601 907 L 1340 540"/>
    <path d="M 1601 907 L 1340 680"/>
    <path d="M 1601 907 L 1340 830"/>
    <path d="M 1601 907 L 1340 940"/>
    <path d="M 1601 907 L 1340 1050"/>
    <path d="M 1601 907 L 1340 1190"/>
    <path d="M 1601 907 L 1340 1300"/>
    <path d="M 1601 907 L 1340 1440"/>
    <path d="M 1601 907 L 1340 1590"/>
  </g>
  <g>
    <use href="#actor" x="210" y="470"/>
    <text class="actor-label" x="210" y="562"><tspan x="210">Operador de</tspan><tspan x="210" dy="28">recolección</tspan></text>
    <use href="#actor" x="210" y="650"/>
    <text class="actor-label" x="210" y="742"><tspan x="210">Revisor de</tspan><tspan x="210" dy="28">recolección</tspan></text>
    <use href="#actor" x="210" y="905"/>
    <text class="actor-label" x="210" y="997"><tspan x="210">Operador de vivero</tspan><tspan x="210" dy="28">(incluye recepción)</tspan></text>
    <use href="#actor" x="210" y="1220"/>
    <text class="actor-label" x="210" y="1312"><tspan x="210">Coordinación de</tspan><tspan x="210" dy="28">plantación</tspan></text>
    <use href="#actor" x="210" y="1400"/>
    <text class="actor-label" x="210" y="1492"><tspan x="210">Participante</tspan><tspan x="210" dy="28">autorizado</tspan></text>
    <use href="#actor" x="210" y="1580"/>
    <text class="actor-label" x="210" y="1672"><tspan x="210">Usuario de consulta</tspan><tspan x="210" dy="28">operativa autorizada</tspan></text>
    <use href="#actor" x="210" y="1780"/>
    <text class="actor-label" x="210" y="1872"><tspan x="210">Visitante</tspan><tspan x="210" dy="28">sin cuenta</tspan></text>
    <use href="#actor" x="1640" y="900"/>
    <text class="actor-label" x="1815" y="886"><tspan x="1815">Administración</tspan><tspan x="1815" dy="33" font-weight="700">ADMIN global</tspan></text>
  </g>
  <g>
    <ellipse class="use-case" cx="950" cy="180" rx="390" ry="43"/>
    <text class="case-label" x="950" y="171"><tspan class="case-id">CU-01</tspan><tspan x="950" dy="32">Administrar datos maestros</tspan></text>
    <ellipse class="use-case" cx="950" cy="290" rx="390" ry="43"/>
    <text class="case-label" x="950" y="281"><tspan class="case-id">CU-08</tspan><tspan x="950" dy="32">Planificar campaña y subcampaña</tspan></text>
    <ellipse class="use-case" cx="950" cy="430" rx="390" ry="43"/>
    <text class="case-label" x="950" y="421"><tspan class="case-id">CU-02</tspan><tspan x="950" dy="32">Registrar recolección</tspan></text>
    <ellipse class="use-case" cx="950" cy="540" rx="390" ry="43"/>
    <text class="case-label" x="950" y="531"><tspan class="case-id">CU-04</tspan><tspan x="950" dy="32">Afectar saldo de Recolección</tspan></text>
    <ellipse class="use-case" cx="950" cy="680" rx="390" ry="43"/>
    <text class="case-label" x="950" y="671"><tspan class="case-id">CU-03</tspan><tspan x="950" dy="32">Revisar recolección</tspan></text>
    <ellipse class="use-case" cx="950" cy="830" rx="390" ry="43"/>
    <text class="case-label" x="950" y="821"><tspan class="case-id">CU-05</tspan><tspan x="950" dy="32">Iniciar lote de vivero</tspan></text>
    <ellipse class="use-case" cx="950" cy="940" rx="390" ry="43"/>
    <text class="case-label" x="950" y="931"><tspan class="case-id">CU-06</tspan><tspan x="950" dy="32">Registrar resultado observado</tspan></text>
    <ellipse class="use-case" cx="950" cy="1050" rx="390" ry="43"/>
    <text class="case-label" x="950" y="1041"><tspan class="case-id">CU-07</tspan><tspan x="950" dy="32">Registrar movimientos de vivero</tspan></text>
    <ellipse class="use-case" cx="950" cy="1190" rx="390" ry="43"/>
    <text class="case-label" x="950" y="1181"><tspan class="case-id">CU-09</tspan><tspan x="950" dy="32">Asignar plantas</tspan></text>
    <ellipse class="use-case" cx="950" cy="1300" rx="390" ry="43"/>
    <text class="case-label" x="950" y="1291"><tspan class="case-id">CU-10</tspan><tspan x="950" dy="32">Devolver plantas</tspan></text>
    <ellipse class="use-case" cx="950" cy="1440" rx="390" ry="43"/>
    <text class="case-label" x="950" y="1431"><tspan class="case-id">CU-11</tspan><tspan x="950" dy="32">Registrar plantación</tspan></text>
    <ellipse class="use-case" cx="950" cy="1590" rx="390" ry="57"/>
    <text class="case-label" x="950" y="1562"><tspan class="case-id">CU-12</tspan><tspan x="950" dy="32">Consultar recorrido registrado</tspan><tspan x="950" dy="32">(consulta operativa autorizada)</tspan></text>
    <ellipse class="use-case" cx="950" cy="1780" rx="390" ry="57"/>
    <text class="case-label" x="950" y="1752"><tspan class="case-id">PA-S02</tspan><tspan x="950" dy="32">Consultar información pública</tspan><tspan x="950" dy="32">de Plantación</tspan></text>
  </g>
  <text x="1000" y="1945" font-size="25">Asociaciones funcionales; permisos y condiciones según los contratos de cada operación.</text>
  <text x="1000" y="1982" font-size="23">La consulta pública de Plantación no implica acceso público al recorrido operativo de Recolección y Vivero.</text>
</svg>
