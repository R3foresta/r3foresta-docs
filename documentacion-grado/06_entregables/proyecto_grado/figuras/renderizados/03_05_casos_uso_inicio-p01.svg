<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550" role="img"><title>Figura 3.5: General y Recolección</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b23;text-anchor:middle}</style><rect width="1200" height="1550" fill="white"/><text x="600" y="60" font-size="34" font-weight="bold"><tspan x="600" dy="0">Figura 3.5 · panel a</tspan></text><text x="600" y="115" font-size="34" font-weight="bold"><tspan x="600" dy="0">General y Recolección</tspan></text><rect x="250" y="210" width="700" height="1150" fill="none" stroke="#476556" stroke-width="3"/><text x="600" y="255" font-size="27"><tspan x="600" dy="0">R3Foresta · alcance académico</tspan></text><path d="M145 500 L290 560" fill="none" stroke="#687c70" stroke-width="2"/><path d="M145 500 L290 960" fill="none" stroke="#687c70" stroke-width="2"/><path d="M145 920 L290 760" fill="none" stroke="#687c70" stroke-width="2"/><path d="M1055 750 L910 360" fill="none" stroke="#687c70" stroke-width="2"/><path d="M1055 750 L910 560" fill="none" stroke="#687c70" stroke-width="2"/><path d="M1055 750 L910 760" fill="none" stroke="#687c70" stroke-width="2"/><path d="M1055 750 L910 960" fill="none" stroke="#687c70" stroke-width="2"/><path d="M1055 750 L910 1160" fill="none" stroke="#687c70" stroke-width="2"/><ellipse cx="600" cy="360" rx="310" ry="78" fill="#f5faf7" stroke="#476556" stroke-width="3"/><text x="600" y="328" font-size="29" font-weight="bold"><tspan x="600" dy="0">CU-01</tspan></text><text x="600" y="365" font-size="30"><tspan x="600" dy="0">Administrar datos maestros y</tspan><tspan x="600" dy="35">usuarios</tspan></text><ellipse cx="600" cy="560" rx="310" ry="78" fill="#f5faf7" stroke="#476556" stroke-width="3"/><text x="600" y="528" font-size="29" font-weight="bold"><tspan x="600" dy="0">CU-02</tspan></text><text x="600" y="565" font-size="30"><tspan x="600" dy="0">Registrar recolección</tspan></text><ellipse cx="600" cy="760" rx="310" ry="78" fill="#f5faf7" stroke="#476556" stroke-width="3"/><text x="600" y="728" font-size="29" font-weight="bold"><tspan x="600" dy="0">CU-03</tspan></text><text x="600" y="765" font-size="30"><tspan x="600" dy="0">Recibir y validar recolección</tspan></text><ellipse cx="600" cy="960" rx="310" ry="78" fill="#f5faf7" stroke="#476556" stroke-width="3"/><text x="600" y="928" font-size="29" font-weight="bold"><tspan x="600" dy="0">CU-04</tspan></text><text x="600" y="965" font-size="30"><tspan x="600" dy="0">Afectar saldo de Recolección</tspan></text><ellipse cx="600" cy="1160" rx="310" ry="78" fill="#f5faf7" stroke="#476556" stroke-width="3"/><text x="600" y="1128" font-size="29" font-weight="bold"><tspan x="600" dy="0">CU-08</tspan></text><text x="600" y="1165" font-size="30"><tspan x="600" dy="0">Planificar campaña y subcampaña</tspan></text><g transform="translate(110 490)" fill="none" stroke="#253d31" stroke-width="3"><circle cy="-32" r="20"/><path d="M0 -12 V48 M-35 8 H35 M0 48 L-30 90 M0 48 L30 90"/></g><text x="110" y="620" font-size="28"><tspan x="110" dy="0">Operador de</tspan><tspan x="110" dy="33">Recolección</tspan></text><g transform="translate(110 910)" fill="none" stroke="#253d31" stroke-width="3"><circle cy="-32" r="20"/><path d="M0 -12 V48 M-35 8 H35 M0 48 L-30 90 M0 48 L30 90"/></g><text x="110" y="1040" font-size="28"><tspan x="110" dy="0">Revisor de</tspan><tspan x="110" dy="33">Recolección</tspan></text><g transform="translate(1090 740)" fill="none" stroke="#253d31" stroke-width="3"><circle cy="-32" r="20"/><path d="M0 -12 V48 M-35 8 H35 M0 48 L-30 90 M0 48 L30 90"/></g><text x="1090" y="870" font-size="28"><tspan x="1090" dy="0">ADMIN global</tspan></text><text x="600" y="1430" font-size="26"><tspan x="600" dy="0">Recepción: ADMIN o VALIDADOR asignado al vivero, distinto del recolector.</tspan></text><text x="600" y="1510" font-size="26"><tspan x="600" dy="0">El mismo sistema y ADMIN se repiten entre paneles.</tspan></text></svg>