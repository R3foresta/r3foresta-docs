<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1740" viewBox="0 0 1510 1740" role="img" aria-labelledby="title description">
  <title id="title">Actores y casos de uso generales de R3Foresta</title>
  <desc id="description">Diagrama UML de casos de uso del alcance académico. Siete actores funcionales externos se asocian con doce casos de uso contenidos en el límite del sistema. Las asociaciones principales no representan una matriz exhaustiva de permisos ni afirman implementación.</desc>
  <defs>
    <g id="actor" fill="none" stroke="#17212b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-29" r="18"/>
      <path d="M 0 -11 V 38 M -39 7 H 39 M 0 38 L -32 72 M 0 38 L 32 72"/>
    </g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; text-anchor: middle; }
      .actor-label { font-size: 26px; }
      .use-case { fill: #fff; stroke: #17212b; stroke-width: 2.5; }
      .case-label { font-size: 26px; }
      .case-id { font-weight: 700; }
      .association { fill: none; stroke: #17212b; stroke-width: 2.3; }
    </style>
  </defs>
  <rect width="1510" height="1740" fill="#fff"/>
  <rect x="500" y="65" width="950" height="1600" fill="#fff" stroke="#17212b" stroke-width="3"/>
  <text x="975" y="113" font-size="31" font-weight="700">R3Foresta · alcance académico</text>

  <g class="association">
    <path d="M 269 227 L 590 180 M 269 227 L 590 280"/>
    <path d="M 269 472 L 590 425 M 269 472 L 590 525"/>
    <path d="M 269 652 L 590 675"/>
    <path d="M 269 902 L 590 825 M 269 902 L 590 925 M 269 902 L 590 1025"/>
    <path d="M 269 1222 L 590 1175 M 269 1222 L 590 1275"/>
    <path d="M 269 1402 L 590 1425"/>
    <path d="M 269 1587 L 590 1575"/>
  </g>

  <g>
    <use href="#actor" x="230" y="220"/>
    <text class="actor-label" x="230" y="328">Administración</text>

    <use href="#actor" x="230" y="465"/>
    <text class="actor-label" x="230" y="557"><tspan x="230">Operador de</tspan><tspan x="230" dy="28">recolección</tspan></text>

    <use href="#actor" x="230" y="645"/>
    <text class="actor-label" x="230" y="737"><tspan x="230">Revisor de</tspan><tspan x="230" dy="28">recolección</tspan></text>

    <use href="#actor" x="230" y="895"/>
    <text class="actor-label" x="230" y="987"><tspan x="230">Operador de</tspan><tspan x="230" dy="28">vivero</tspan></text>

    <use href="#actor" x="230" y="1215"/>
    <text class="actor-label" x="230" y="1307"><tspan x="230">Coordinación de</tspan><tspan x="230" dy="28">plantación</tspan></text>

    <use href="#actor" x="230" y="1395"/>
    <text class="actor-label" x="230" y="1487"><tspan x="230">Participante</tspan><tspan x="230" dy="28">autorizado</tspan></text>

    <use href="#actor" x="230" y="1580"/>
    <text class="actor-label" x="230" y="1672"><tspan x="230">Usuario autorizado</tspan><tspan x="230" dy="28">de consulta</tspan></text>
  </g>

  <g>
    <ellipse class="use-case" cx="980" cy="180" rx="390" ry="40"/>
    <text class="case-label" x="980" y="171"><tspan class="case-id">CU-01</tspan><tspan x="980" dy="31">Administrar datos maestros</tspan></text>

    <ellipse class="use-case" cx="980" cy="280" rx="390" ry="40"/>
    <text class="case-label" x="980" y="271"><tspan class="case-id">CU-08</tspan><tspan x="980" dy="31">Planificar campaña y subcampaña</tspan></text>

    <ellipse class="use-case" cx="980" cy="425" rx="390" ry="40"/>
    <text class="case-label" x="980" y="416"><tspan class="case-id">CU-02</tspan><tspan x="980" dy="31">Registrar recolección</tspan></text>

    <ellipse class="use-case" cx="980" cy="525" rx="390" ry="40"/>
    <text class="case-label" x="980" y="516"><tspan class="case-id">CU-04</tspan><tspan x="980" dy="31">Afectar saldo de Recolección</tspan></text>

    <ellipse class="use-case" cx="980" cy="675" rx="390" ry="40"/>
    <text class="case-label" x="980" y="666"><tspan class="case-id">CU-03</tspan><tspan x="980" dy="31">Revisar recolección</tspan></text>

    <ellipse class="use-case" cx="980" cy="825" rx="390" ry="40"/>
    <text class="case-label" x="980" y="816"><tspan class="case-id">CU-05</tspan><tspan x="980" dy="31">Iniciar lote de vivero</tspan></text>

    <ellipse class="use-case" cx="980" cy="925" rx="390" ry="40"/>
    <text class="case-label" x="980" y="916"><tspan class="case-id">CU-06</tspan><tspan x="980" dy="31">Registrar resultado observado</tspan></text>

    <ellipse class="use-case" cx="980" cy="1025" rx="390" ry="40"/>
    <text class="case-label" x="980" y="1016"><tspan class="case-id">CU-07</tspan><tspan x="980" dy="31">Registrar movimientos de vivero</tspan></text>

    <ellipse class="use-case" cx="980" cy="1175" rx="390" ry="40"/>
    <text class="case-label" x="980" y="1166"><tspan class="case-id">CU-09</tspan><tspan x="980" dy="31">Asignar plantas</tspan></text>

    <ellipse class="use-case" cx="980" cy="1275" rx="390" ry="40"/>
    <text class="case-label" x="980" y="1266"><tspan class="case-id">CU-10</tspan><tspan x="980" dy="31">Devolver plantas</tspan></text>

    <ellipse class="use-case" cx="980" cy="1425" rx="390" ry="40"/>
    <text class="case-label" x="980" y="1416"><tspan class="case-id">CU-11</tspan><tspan x="980" dy="31">Registrar plantación</tspan></text>

    <ellipse class="use-case" cx="980" cy="1575" rx="390" ry="40"/>
    <text class="case-label" x="980" y="1566"><tspan class="case-id">CU-12</tspan><tspan x="980" dy="31">Consultar recorrido registrado</tspan></text>
  </g>
</svg>
