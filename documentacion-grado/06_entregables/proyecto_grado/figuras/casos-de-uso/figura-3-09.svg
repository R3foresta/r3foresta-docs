<ellipse class="usecase primary" cx="193" cy="192" rx="81" ry="22"/>
<text class="" x="193" y="196" text-anchor="middle">Eliminar borrador</text>
<ellipse class="usecase primary" cx="193" cy="274" rx="81" ry="25"/>
