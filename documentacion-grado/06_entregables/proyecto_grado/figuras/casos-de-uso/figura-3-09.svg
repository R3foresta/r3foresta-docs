  .actor { fill: #fff; stroke: #24363e; stroke-width: 1.35 }
  .usecase { fill: #fff; stroke: #42545b; stroke-width: 1.25 }
  .primary { fill: #f5f8f6; stroke: #325c52; stroke-width: 1.35 }
  .edge { fill: none; stroke: #40545a; stroke-width: 1.18 }
  .dependency { stroke-dasharray: 4 3; marker-end: url(#arrow) }
  .note { fill: #f7f9f8; stroke: #a5b4ad; stroke-width: .8 }</style>
