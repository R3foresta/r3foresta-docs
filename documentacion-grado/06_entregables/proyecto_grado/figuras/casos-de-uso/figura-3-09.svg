<text class="" x="118" y="317" text-anchor="start">La recepción exige un revisor distinto del recolector.</text>
<ellipse class="usecase primary" cx="193" cy="369" rx="81" ry="20"/>
<text class="" x="193" y="373" text-anchor="middle">Registrar DESECHO</text>
<ellipse class="usecase" cx="390" cy="369" rx="57" ry="25"/>
<text class="" x="390" y="366" text-anchor="middle">Validar estado,</text>
<text class="" x="390" y="380" text-anchor="middle">unidad y saldo</text>
<text class="" x="111" y="407" text-anchor="start">El desecho requiere autoridad sobre la custodia.</text>
<ellipse class="usecase primary" cx="193" cy="464" rx="81" ry="22"/>
<text class="" x="193" y="461" text-anchor="middle">Consultar historial</text>
<text class="" x="193" y="475" text-anchor="middle">autorizado</text>
<text class="" x="286" y="459" text-anchor="start">Propio según acceso.</text>
<text class="" x="286" y="473" text-anchor="start">Por especie: ADMIN.</text>
<ellipse class="usecase primary" cx="193" cy="545" rx="81" ry="23"/>
<text class="" x="193" y="542" text-anchor="middle">Consultar banco</text>
<text class="" x="193" y="556" text-anchor="middle">público de semillas</text>
<text class="" x="286" y="535" text-anchor="start">Semillas no eliminadas.</text>
<text class="" x="286" y="549" text-anchor="start">Fotos sanitizadas solo</text>
<text class="" x="286" y="563" text-anchor="start">de VALIDADO.</text>
