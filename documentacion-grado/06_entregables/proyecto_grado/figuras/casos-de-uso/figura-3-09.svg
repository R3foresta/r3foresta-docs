<svg xmlns="http://www.w3.org/2000/svg" width="470" height="580" viewBox="0 0 470 580" role="img" aria-labelledby="title desc">
<title id="title">R3Foresta · M1 Recolección</title>
<desc id="desc">La captura, el envío y la eliminación lógica requieren acceso M1 propio o autoridad global. El revisor es ADMIN o VALIDADOR con asignación vigente al almacenamiento y es distinto del recolector para recibir. La consulta pública es independiente de las operaciones y del historial privado.</desc>
