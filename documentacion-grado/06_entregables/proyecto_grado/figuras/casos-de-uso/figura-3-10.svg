<svg xmlns="http://www.w3.org/2000/svg" width="470" height="618" viewBox="0 0 470 618" role="img" aria-labelledby="title desc">
<title id="title">R3Foresta · M2 Vivero</title>
<desc id="desc">El lote iniciado desde Recolección conserva unidad de origen y consumo atómico. ADMIN registra incorporación o inventario inicial con procedencia y foto privada. La incorporación crea saldo vivo sin embolsado previo. Los operarios autorizados registran resultados y movimientos según la modalidad y el saldo.</desc>
